name: Build Docker Image and Deploy to AWS Beanstalk

on:
  push:
    branches:
      - assignment-03

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push Docker image to ECR
        env:
          ECR_REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          echo "IMAGE_URI=$IMAGE_URI"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Generate Dockerrun.aws.json (single-container v1)
        env:
          ECR_REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y jq

          IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          echo "Using IMAGE_URI=$IMAGE_URI"

          # Limpia por si existía uno viejo
          rm -f Dockerrun.aws.json deploy.zip

          # Genera JSON 100% válido (sin comillas raras, sin indentación problemática)
          jq -n --arg img "$IMAGE_URI" '{
            AWSEBDockerrunVersion: 1,
            Image: { Name: $img, Update: true },
            Ports: [ { ContainerPort: 80 } ]
          }' > Dockerrun.aws.json

          echo "===== Dockerrun.aws.json (FINAL) ====="
          cat Dockerrun.aws.json
          echo "======================================"

          # Validación rápida: debe imprimir el número 1
          echo -n "Dockerrun version detected: "
          jq -r '.AWSEBDockerrunVersion' Dockerrun.aws.json

      - name: Create deploy.zip (only Dockerrun.aws.json)
        run: |
          set -e
          zip -r deploy.zip Dockerrun.aws.json

          echo "===== ZIP content ====="
          unzip -l deploy.zip
          echo "===== Dockerrun inside ZIP (what EB receives) ====="
          unzip -p deploy.zip Dockerrun.aws.json
          echo "======================================"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ secrets.EB_APPLICATION_NAME }}
          environment_name: ${{ secrets.EB_ENVIRONMENT_NAME }}
          region: ${{ secrets.AWS_REGION }}
          version_label: v-${{ github.run_id }}-${{ github.run_attempt }}
          deployment_package: deploy.zip
          existing_bucket_name: elasticbeanstalk-us-east-1-209479280647
          wait_for_deployment: true