name: Build Docker Image and Deploy to AWS Beanstalk

on:
  push:
    branches:
      - assignment-03

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2) AWS creds
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3) Login ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4) Build + Push Docker image
      - name: Build and push Docker image to ECR
        env:
          ECR_REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          echo "Building image: $ECR_REPOSITORY_URI:$IMAGE_TAG"
          docker build -t "$ECR_REPOSITORY_URI:$IMAGE_TAG" .
          echo "Pushing image..."
          docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"
          echo "Image pushed successfully."

      # 5) Generate Dockerrun.aws.json (v1)
      - name: Generate Dockerrun.aws.json (single container v1)
        env:
          ECR_REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          echo "Using IMAGE = $IMAGE"

          cat > Dockerrun.aws.json <<EOF
          {
            "AWSEBDockerrunVersion": 1,
            "Image": {
              "Name": "$IMAGE",
              "Update": "true"
            },
            "Ports": [
              { "ContainerPort": 80 }
            ]
          }
          EOF

          echo "===== Dockerrun.aws.json content ====="
          cat Dockerrun.aws.json
          echo "======================================"

      # 6) Zip ONLY Dockerrun.aws.json (must be at root)
      - name: Create deploy.zip
        run: |
          set -e
          rm -f deploy.zip
          zip -r deploy.zip Dockerrun.aws.json

          echo "===== ZIP content (must show Dockerrun.aws.json at root) ====="
          unzip -l deploy.zip
          echo "============================================================="

      # 7) Deploy to Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ secrets.EB_APPLICATION_NAME }}
          environment_name: ${{ secrets.EB_ENVIRONMENT_NAME }}
          region: ${{ secrets.AWS_REGION }}
          version_label: v-${{ github.run_id }}-${{ github.run_attempt }}
          deployment_package: deploy.zip
          existing_bucket_name: elasticbeanstalk-us-east-1-209479280647
          wait_for_deployment: true